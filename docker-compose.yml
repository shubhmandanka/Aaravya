services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Real values (DATABASE_URL/DIRECT_URL pointed at Supabase, the
    # Supabase project keys, etc.) come from the project's own .env file —
    # NOT from a hardcoded value here. Docker Compose loads env_file entries
    # into the container's real environment (unlike Next's own .env loader,
    # which silently ignores .env values for anything already set in the
    # environment), so this is the one place those values must live for the
    # `app` container. SMTP_* below intentionally override .env's host-side
    # SMTP_HOST/PORT: inside the Compose network the mail sink is reachable
    # by its service name, not localhost.
    env_file:
      - .env
    environment:
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM: "Aaravya Hospital <no-reply@aaravyahospital.local>"
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
      - app_next_cache:/app/.next

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aaravya
      POSTGRES_USER: aaravya
      POSTGRES_PASSWORD: aaravya_local_pw
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaravya -d aaravya"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "8026:8025" # web UI
      - "1026:1025" # SMTP

volumes:
  db_data:
  app_node_modules:
  app_next_cache:
  app_prisma_client:
